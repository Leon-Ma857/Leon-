[package]
name = "snaptrans"
version = "0.8.6"
description = "Quick WeChat-style screenshot translation desktop app"
authors = ["SnapTrans Contributors"]
edition = "2021"

[lib]
name = "snaptrans_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "socks", "system-proxy"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
thiserror = "2"
arboard = "3"
rfd = "0.15"
rqrr = "0.11"
sha2 = "0.10"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["util"] }

[dev-dependencies]
minisign-verify = "0.3"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
